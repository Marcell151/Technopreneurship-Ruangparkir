<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>RuangParkir - Marketplace Parkir Komunitas Warga</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <style>
    body {
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 1.25rem);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .scan-line {
      animation: scanMove 2s infinite ease-in-out;
    }

    @keyframes scanMove {

      0%,
      100% {
        top: 8%;
        opacity: 0.3;
      }

      50% {
        top: 88%;
        opacity: 1;
      }
    }

    /* Phone mockup frame containment */
    .phone-screen {
      transform: translate3d(0, 0, 0);
      -webkit-transform: translate3d(0, 0, 0);
      contain: paint;
    }

    .phone-screen .min-h-screen {
      min-height: 100%;
    }

    .phone-screen .h-screen {
      height: 100%;
    }
  </style>
</head>

      const h = Math.floor(sec / 3600);

    function selectLoginPreset(roleKey) {
      state.loginRole = roleKey;

      state.loginIdentifier = acc.identifier;
      state.loginPassword = '••••••••';
      render();
    }

    function togglePasswordVisibility() {
      state.showPassword = !state.showPassword;
      render();
    }

    function handleLoginSubmit() {
      const acc = DEMO_ACCOUNTS[state.loginRole];
      state.userRole = state.loginRole;
      state.currentUser = {
        name: acc.name,
        phone: acc.phone,
        email: acc.email,
        role: state.loginRole
      };

      showToast(`Berhasil masuk sebagai ${acc.name}`);

      if (state.loginRole === 'DRIVER') {
        setScreen('HOME');
      } else if (state.loginRole === 'LANDOWNER') {
        setScreen('LANDOWNER');
      } else if (state.loginRole === 'ATTENDANT') {
        setScreen('ATTENDANT');
      }
    }

    function handleBiometricLogin() {
      showToast('Memverifikasi Biometrik (Face ID / Sidik Jari)...');
      setTimeout(() => {
        handleLoginSubmit();
      }, 700);
    }

    function handleRegisterSubmit() {
      state.registerModal = false;
      const roleInputs = document.getElementsByName('reg-role');
      let selected = 'DRIVER';
      for (const r of roleInputs) {
        if (r.checked) selected = r.value;
      }
      selectLoginPreset(selected);
      showToast('Registrasi berhasil! Akun Anda aktif.');
      handleLoginSubmit();
    }

    function applyPromoCode() {
      const code = document.getElementById('checkout-promo-input').value.trim().toUpperCase();
      state.promoCode = code;
      if (code === 'HEMAT1K' || code === 'DISKONPARKIR') {
        state.discountAmount = 1000;
        showToast('Voucher valid! Diskon Rp 1.000 diterapkan.');
      } else if (code === '') {
        state.discountAmount = 0;
      } else {
        state.discountAmount = 0;
        showToast('Kode voucher tidak ditemukan');
      }
      render();
    }

    function handleBookingPayment(finalTotal) {
      const plateEl = document.getElementById('checkout-plate-input');
      if (plateEl && plateEl.value.trim() !== '') {
        state.plateNumber = plateEl.value.trim().toUpperCase();
      }

      if (state.paymentMethod === 'SALDO') {
        if (state.walletBalance < finalTotal) {
          showToast('Saldo RuangPay tidak mencukupi, silakan isi saldo.');
          state.topUpModal = true;
          render();
          return;
        }
        state.walletBalance -= finalTotal;
      }

      const bookingCode = `RP-${Math.floor(10000 + Math.random() * 90000)}`;
      const assignedSlot = state.vehicleType === 'MOTOR' ? 'Slot M-02' : 'Slot A-02';

      state.activeBooking = {
        code: bookingCode,
        spotName: state.selectedSpot ? state.selectedSpot.name : 'Garasi Pak Budi - Soekarno Hatta No. 45',
        plate: state.plateNumber,
        slot: assignedSlot,
        vehicle: state.vehicleType,
        plannedDuration: state.plannedDuration,
        depositPaid: finalTotal,
        overstayPaid: 0,
        checkInTime: null,
        paymentMethod: state.paymentMethod
      };

      state.ticketStatus = 'WAITING_CHECKIN';
      state.parkingSecondsElapsed = 0;

      // Masukkan ke antrean log juru parkir
      state.parkedVehicles.unshift({
        plate: state.plateNumber,
        type: state.vehicleType === 'MOBIL' ? 'Mobil Tamu' : 'Motor Tamu',
        slot: assignedSlot,
        durationNow: 'Menunggu Check-in',
        durationSec: 0,
        note: `Booking #${bookingCode}`,
        status: 'WAITING_CHECKIN'
      });

      // Masukkan ke riwayat
      state.historyList.unshift({
        code: bookingCode,
        spot: state.activeBooking.spotName,
        vehicle: state.vehicleType,
        plate: state.activeBooking.plate,
        date: 'Hari Ini',
        duration: `Rencana ${state.plannedDuration} Jam`,
        deposit: finalTotal,
        overstay: 0,
        cost: finalTotal,
        status: 'Menunggu Check-in'
      });

      showToast(`Deposit ${formatIDR(finalTotal)} terbayar. E-Tiket aktif!`);
      setScreen('TICKET');
    }

    function confirmCheckIn() {
      state.ticketStatus = 'ACTIVE';
      state.parkingSecondsElapsed = 6300; // Simulasi 1 jam 45 menit untuk kelancaran presentasi
      state.activeBooking.checkInTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (state.historyList[0]) {
        state.historyList[0].status = 'Aktif Parkir';
      }

      const v = state.parkedVehicles.find(x => x.plate === state.activeBooking.plate);
      if (v) {
        v.status = 'ACTIVE';
        v.durationNow = '01:45:00';
      }

      state.scannerModal = false;
      showToast('Scan Check-In berhasil. Argometer waktu dimulai!');
      render();
    }

    function handleSaveNewGarage(e) {
      e.preventDefault();
      const name = document.getElementById('new_garage_name').value;
      const address = document.getElementById('new_garage_address').value;
      const carSlots = parseInt(document.getElementById('new_garage_car_slots').value) || 2;
      const bikeSlots = parseInt(document.getElementById('new_garage_bike_slots').value) || 5;

      const newGar = {
        id: String(Date.now()),
        name: name,
        address: address,
        slotsCar: carSlots,
        slotsBike: bikeSlots,
        occupiedCar: 0,
        occupiedBike: 0,
        priceFlatCar: 8000,
        priceFlatBike: 3000,
        isOpen: true
      };

      myGarages.unshift(newGar);
      state.addGarageModal = false;
      showToast('Lahan "' + name + '" berhasil didaftarkan');
      render();
    }

                <button onclick="state.overstayScenario = 'scenario_4h'; render();" class="py-1.5 rounded-xl transition cursor-pointer ${state.overstayScenario === 'scenario_4h' ? 'bg-slate-900 text-white shadow-sm' : 'bg-white text-slate-700'}">4 Jam<br><span class="text-[9px] font-normal">+1k</span></button>
                <button onclick="state.overstayScenario = 'scenario_5h'; render();" class="py-1.5 rounded-xl transition cursor-pointer ${state.overstayScenario === 'scenario_5h' ? 'bg-slate-900 text-white shadow-sm' : 'bg-white text-slate-700'}">5 Jam<br><span class="text-[9px] font-normal">+2k</span></button>
                <button onclick="state.overstayScenario = 'scenario_6h'; render();" class="py-1.5 rounded-xl transition cursor-pointer ${state.overstayScenario === 'scenario_6h' ? 'bg-slate-900 text-white shadow-sm' : 'bg-white text-slate-700'}">6 Jam<br><span class="text-[9px] font-normal">+3k</span></button>
              </div>
            </div>

            <!-- Rincian Evaluasi Durasi -->
            <div class="space-y-1.5 text-xs text-left bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
              <div class="flex justify-between"><span class="text-slate-500">Deposit Awal:</span><span class="font-bold text-slate-800">${formatIDR(depositPaid)} (Flat 3 Jam)</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Durasi Aktual:</span><span class="font-bold text-slate-900">${actualDurationText}</span></div>
              <div class="pt-2 border-t border-slate-200 flex justify-between items-center">
                <span class="font-bold text-slate-900">Penyesuaian Biaya (Overstay):</span>
                <span class="font-bold text-sm ${isOverstay ? 'text-amber-600' : 'text-emerald-600'}">${formatIDR(fineAmount)}</span>
              </div>
            </div>

            <!-- Rincian Bagi Hasil 40:40:20 -->
            <div class="my-2.5 p-2.5 bg-slate-50 rounded-2xl border border-slate-200 text-left text-[11px] space-y-1">
              <div class="font-bold text-slate-700 text-[10px] uppercase">Alokasi Bagi Hasil Total (${formatIDR(totalTransaction)}):</div>
              <div class="flex justify-between text-slate-500"><span>• Pemilik Lahan (40%):</span><span class="font-bold text-slate-800">${formatIDR(shareLandowner)}</span></div>
              <div class="flex justify-between text-slate-500"><span>• Mitra Jukir (40%):</span><span class="font-bold text-slate-800">${formatIDR(shareJukir)}</span></div>
              <div class="flex justify-between text-slate-500"><span>• Platform RuangParkir (20%):</span><span class="font-bold text-slate-800">${formatIDR(sharePlatform)}</span></div>
            </div>

            <p class="my-2 text-[11px] text-slate-500 text-left leading-relaxed">
              ${explanation}
            </p>

            <button onclick="handleCheckoutSettlement(${fineAmount}, ${totalTransaction}, '${actualDurationText}')" class="h-14 min-h-[52px] w-full bg-slate-900 hover:bg-black active:scale-[0.98] text-white rounded-2xl font-bold text-sm shadow-md transition cursor-pointer flex items-center justify-center gap-2">
              <span>Konfirmasi Selesai (${isOverstay ? `Auto-Debit ${formatIDR(fineAmount)}` : 'Lunas Rp 0 Tambahan'})</span>
            </button>
          </div>
        </div>
      `;
    }

    function handleCheckoutSettlement(fineAmount, totalTransaction, actualDurationText) {
      if (fineAmount > 0) {
        state.walletBalance -= fineAmount;
      }

      const landownerShare = totalTransaction * 0.4;
      const jukirShare = totalTransaction * 0.4;

      state.landownerBalance += Math.round(landownerShare);
      state.todayRevenue += Math.round(landownerShare);
      state.attendantEarningsToday += Math.round(jukirShare);
      state.totalVehiclesManagedToday += 1;

      const plate = state.activeBooking.plate;
      state.parkedVehicles = state.parkedVehicles.filter(v => v.plate !== plate);

      state.ticketStatus = 'FINISHED';
      state.overstayModal = false;

      if (state.historyList[0]) {
        state.historyList[0].status = 'Selesai';
        state.historyList[0].duration = `${actualDurationText} (Aktual)`;
        state.historyList[0].overstay = fineAmount;
        state.historyList[0].cost = totalTransaction;
      }

      showToast(`Pembayaran selesai. Bagi hasil 40:40:20 berhasil disalurkan.`);
      state.ratingModal = true;
      setScreen('TICKET');
    }

    // ==========================================
    // MAIN RENDER CONTROLLER
    // ==========================================
    function render() {
      const app = document.getElementById('app');
      let content = '';

      switch (state.currentScreen) {
        case 'SPLASH':
          content = renderSplash();
          break;
        case 'LOGIN':
          content = renderLogin();
          break;
        case 'HOME':
          content = renderHome();
          break;
        case 'DETAIL':
          content = renderDetail();
          break;
        case 'CHECKOUT':
          content = renderCheckout();
          break;
        case 'TICKET':
          content = renderTicket();
          break;
        case 'DRIVER_HISTORY':
          content = renderDriverHistory();
          break;
        case 'LANDOWNER':
          content = renderLandowner();
          break;
        case 'LANDOWNER_MANAGE':
          content = renderLandownerManage();
          break;
        case 'ATTENDANT':
          content = renderAttendant();
          break;
        case 'ATTENDANT_LOGS':
          content = renderAttendantLogs();
          break;
        case 'PROFILE':
          content = renderProfile();
          break;
        default:
          content = renderHome();
      }

      app.innerHTML = `
        ${renderGlobalHeader()}
        ${renderToast()}
        ${renderRatingModal()}
        ${content}
      `;

      // Update phone status bar & gesture bar theme
      const isDark = ['ATTENDANT', 'ATTENDANT_LOGS'].includes(state.currentScreen);
      const statusBar = document.getElementById('phone-status-bar');
      const homeBar = document.getElementById('phone-home-indicator');
      if (statusBar) {
        if (isDark) {
          statusBar.classList.remove('text-slate-800');
          statusBar.classList.add('text-white');
        } else {
          statusBar.classList.remove('text-white');
          statusBar.classList.add('text-slate-800');
        }
      }
      if (homeBar) {
        if (isDark) {
          homeBar.className = 'w-32 h-1 bg-white/40 rounded-full transition-colors duration-200';
        } else {
          homeBar.className = 'w-32 h-1 bg-slate-900/30 rounded-full transition-colors duration-200';
        }
      }
    }


    // Live Phone Clock Indicator
    function updatePhoneClock() {
      const el = document.getElementById('phone-clock');
      if (el) {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        el.textContent = `${h}:${m}`;
      }
    }
    setInterval(updatePhoneClock, 1000);
    updatePhoneClock();


    // Responsive Laptop & Monitor Auto-Fit Scaler
    state.scaleMode = 'FIT';

    function setScaleMode(mode) {
      state.scaleMode = mode;
      const btnFit = document.getElementById('btn-scale-fit');
      const btn100 = document.getElementById('btn-scale-100');
      if (btnFit && btn100) {
        if (mode === 'FIT') {
          btnFit.className = 'px-2 py-0.5 text-[10px] font-semibold rounded transition cursor-pointer bg-slate-900 text-white';
          btn100.className = 'px-2 py-0.5 text-[10px] font-semibold rounded transition cursor-pointer text-slate-600 hover:text-slate-900';
        } else {
          btnFit.className = 'px-2 py-0.5 text-[10px] font-semibold rounded transition cursor-pointer text-slate-600 hover:text-slate-900';
          btn100.className = 'px-2 py-0.5 text-[10px] font-semibold rounded transition cursor-pointer bg-slate-900 text-white';
        }
      }
      autoScaleDevice();
    }

    function autoScaleDevice() {
      const wrapper = document.getElementById('device-wrapper');
      const container = document.getElementById('device-container');
      const scaleLabel = document.getElementById('scale-label');
      if (!wrapper) return;

      if (window.innerWidth < 640) {
        wrapper.style.transform = 'none';
        if (container) container.style.height = 'auto';
        if (scaleLabel) scaleLabel.textContent = 'Mobile';
        return;
      }

      const deviceH = 844;
      const availableH = window.innerHeight - 70; // 70px margin for top presentation bar & padding

      let scale = 1;
      if (state.scaleMode === 'FIT') {
        scale = Math.min(1, Math.max(0.6, availableH / deviceH));
      } else if (state.scaleMode === '100') {
        scale = 1;
      }

      wrapper.style.transform = `scale(${scale})`;
      wrapper.style.transformOrigin = 'top center';

      if (container) {
        container.style.height = `${Math.round(deviceH * scale)}px`;
      }
      if (scaleLabel) {
        scaleLabel.textContent = `${Math.round(scale * 100)}%`;
      }
    }

    window.addEventListener('resize', autoScaleDevice);

    // Initial Execution
    render();
    autoScaleDevice();
  </script>
</body>

</html>
